name: StatusDesk checks and image

on:
  push:
    branches: [codex/statusdesk-main]
  pull_request:
    branches: [codex/statusdesk-main]
  workflow_dispatch:
  workflow_call:
    inputs:
      revision:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: statusdesk-${{ github.workflow }}-${{ github.ref }}-${{ inputs.revision }}
  cancel-in-progress: true

jobs:
  tests:
    if: github.repository == 'Liaders/cortendesk'
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    env:
      APP_ENV: testing
      APP_KEY: base64:eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHg=
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      MAIL_MAILER: array
      BCRYPT_ROUNDS: '4'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || '' }}
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, zip
          coverage: none
          tools: composer
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer validate --no-check-publish
      - run: composer audit --locked --no-interaction
      - run: php vendor/bin/pest
      - run: node --test tests/group-picker.test.cjs
      - name: Check maintained PHP formatting
        shell: bash
        run: |
          base=$(php -r '$s=json_decode(file_get_contents("statusdesk-upstream.json"),true);echo $s["commit"];')
          mapfile -t files < <(git diff --name-only --diff-filter=ACM "$base" HEAD -- '*.php' ':!resources/views/*')
          if ((${#files[@]})); then php vendor/bin/pint --test "${files[@]}"; fi

  container:
    if: github.repository == 'Liaders/cortendesk'
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.revision || '' }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - id: version
        run: echo "version=$(cat STATUSDESK_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: statusdesk-console:test
          build-args: STATUSDESK_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start an isolated server and verify the report
        run: bash scripts/statusdesk/smoke-container.sh statusdesk-console:test

  publish:
    if: github.repository == 'Liaders/cortendesk' && github.event_name == 'push' && github.ref == 'refs/heads/codex/statusdesk-main'
    needs: [tests, container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: image
        shell: bash
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          echo "name=ghcr.io/${OWNER,,}/statusdesk-console" >> "$GITHUB_OUTPUT"
          echo "version=$(cat STATUSDESK_VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:edge
          build-args: STATUSDESK_VERSION=${{ steps.image.outputs.version }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Record the immutable deployment reference
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          printf 'Verified image: `%s@%s`\n\nDeployment is a separate manual operation.\n' "$IMAGE" "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
